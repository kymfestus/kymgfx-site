# Merge into your HTTPS server block; supply your actual root and TLS config.
index index.html;
error_page 404 /404.html;
add_header Content-Security-Policy "frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), clipboard-read=(), clipboard-write=(self), fullscreen=(self)" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header Cache-Control "public, max-age=0, must-revalidate" always;
# Use normal static routing. If another location sets add_header, repeat these
# headers there because Nginx header inheritance depends on configuration.
